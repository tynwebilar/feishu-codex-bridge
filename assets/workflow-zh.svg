<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>在飞书里，像同事一样协作</title><rect width="1280" height="800" rx="28" fill="#F0F5FA"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="48" y="59" font-size="32" fill="#102D49" font-weight="700">从一句求助，到继续推进工作。</text><text x="48" y="96" font-size="16" fill="#60758B" font-weight="400">根据真实工作场景重绘 · 匿名示意，非原始截图</text><rect x="48" y="126" width="384" height="96" rx="16" fill="#E0EDFD"/><text x="70" y="164" font-size="23" fill="#143655" font-weight="700">01  扫码创建</text><text x="70" y="198" font-size="17" fill="#496782" font-weight="400">初始化向导带你创建飞书机器人</text><rect x="448" y="126" width="384" height="96" rx="16" fill="#E4F4EF"/><text x="470" y="164" font-size="23" fill="#143655" font-weight="700">02  卡片授权</text><text x="470" y="198" font-size="17" fill="#496782" font-weight="400">看清所需权限，点按钮继续</text><rect x="848" y="126" width="384" height="96" rx="16" fill="#E0EDFD"/><text x="870" y="164" font-size="23" fill="#143655" font-weight="700">03  开始协作</text><text x="870" y="198" font-size="17" fill="#496782" font-weight="400">在群聊或私聊中跟进任务</text><rect x="48" y="248" width="712" height="474" rx="16" fill="#FFFFFF"/><text x="76" y="287" font-size="20" fill="#153E61" font-weight="700">工作群 · 问题跟进</text><rect x="196" y="310" width="530" height="52" rx="16" fill="#DFEBFF"/><text x="214" y="343" font-size="19" fill="#20334F" font-weight="400">需要看下客户端截图吗？</text><rect x="76" y="378" width="612" height="105" rx="16" fill="#F1F5FA"/><text x="96" y="412" font-size="18" fill="#20334F" font-weight="400">请补一张带任务状态和报错位置的截图。</text><text x="96" y="445" font-size="18" fill="#20334F" font-weight="400">目前的信息还不足以确认原因。</text><rect x="404" y="503" width="322" height="50" rx="16" fill="#DFEBFF"/><text x="424" y="535" font-size="18" fill="#20334F" font-weight="400">在开会，一会儿补。</text><rect x="76" y="574" width="612" height="98" rx="16" fill="#F1F5FA"/><text x="96" y="610" font-size="19" fill="#20334F" font-weight="400">你先开会，方便时再补就好。</text><text x="96" y="643" font-size="18" fill="#20334F" font-weight="400">这次原因还待确认，收到后继续核对。</text><rect x="784" y="248" width="448" height="474" rx="16" fill="#FFFFFF"/><text x="812" y="287" font-size="20" fill="#153E61" font-weight="700">主人私聊 · 按需授权</text><rect x="812" y="314" width="392" height="294" rx="16" fill="#F1F5FA"/><text x="836" y="352" font-size="24" fill="#183E5B" font-weight="700">飞书个人授权</text><text x="836" y="393" font-size="18" fill="#20334F" font-weight="400">当前任务需要以下权限：</text><text x="836" y="426" font-size="17" fill="#496782" font-weight="400">docs:permission.member:create</text><text x="836" y="466" font-size="17" fill="#20334F" font-weight="400">查看权限后，点击按钮授权。</text><text x="836" y="497" font-size="17" fill="#20334F" font-weight="400">授权完成后自动继续原任务。</text><rect x="836" y="523" width="142" height="48" rx="16" fill="#176BEE"/><text x="860" y="554" font-size="18" fill="#FFFFFF" font-weight="600">去授权</text><text x="812" y="646" font-size="16" fill="#60758B" font-weight="400">权限按任务申请，个人授权仅限主人。</text><text x="812" y="676" font-size="16" fill="#60758B" font-weight="400">卡片与回复内容以实际任务为准。</text><text x="48" y="765" font-size="16" fill="#60758B" font-weight="400">扫码后仍需完成租户审批、应用发布与配对；业务查询能力来自你配置的工具与权限。</text></g></svg>