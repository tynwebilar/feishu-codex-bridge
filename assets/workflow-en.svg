<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>An AI teammate, right in Feishu</title><rect width="1280" height="800" rx="28" fill="#F0F5FA"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="48" y="59" font-size="32" fill="#102D49" font-weight="700">From a question to the next useful step.</text><text x="48" y="96" font-size="16" fill="#60758B" font-weight="400">Illustrated from real workflows · anonymized examples, not screenshots</text><rect x="48" y="126" width="384" height="96" rx="16" fill="#E0EDFD"/><text x="70" y="164" font-size="23" fill="#143655" font-weight="700">01  Scan to create</text><text x="70" y="198" font-size="17" fill="#496782" font-weight="400">Create a Feishu bot with guided setup</text><rect x="448" y="126" width="384" height="96" rx="16" fill="#E4F4EF"/><text x="470" y="164" font-size="23" fill="#143655" font-weight="700">02  Authorize in chat</text><text x="470" y="198" font-size="17" fill="#496782" font-weight="400">Review scopes. Tap to continue.</text><rect x="848" y="126" width="384" height="96" rx="16" fill="#E0EDFD"/><text x="870" y="164" font-size="23" fill="#143655" font-weight="700">03  Work together</text><text x="870" y="198" font-size="17" fill="#496782" font-weight="400">Follow tasks in groups or private chat</text><rect x="48" y="248" width="712" height="474" rx="16" fill="#FFFFFF"/><text x="76" y="287" font-size="20" fill="#153E61" font-weight="700">Team chat · Following up</text><rect x="196" y="310" width="530" height="52" rx="16" fill="#DFEBFF"/><text x="214" y="343" font-size="19" fill="#20334F" font-weight="400">Do you need a screenshot of the client?</text><rect x="76" y="378" width="612" height="105" rx="16" fill="#F1F5FA"/><text x="96" y="412" font-size="18" fill="#20334F" font-weight="400">Please include the task status and the error location.</text><text x="96" y="445" font-size="18" fill="#20334F" font-weight="400">There is not enough evidence to confirm the cause yet.</text><rect x="404" y="503" width="322" height="50" rx="16" fill="#DFEBFF"/><text x="424" y="535" font-size="18" fill="#20334F" font-weight="400">In a meeting. I’ll send it later.</text><rect x="76" y="574" width="612" height="98" rx="16" fill="#F1F5FA"/><text x="96" y="610" font-size="19" fill="#20334F" font-weight="400">No rush. Send it when you are free.</text><text x="96" y="643" font-size="18" fill="#20334F" font-weight="400">The cause is still unconfirmed. We’ll continue then.</text><rect x="784" y="248" width="448" height="474" rx="16" fill="#FFFFFF"/><text x="812" y="287" font-size="20" fill="#153E61" font-weight="700">Owner chat · Scoped access</text><rect x="812" y="314" width="392" height="294" rx="16" fill="#F1F5FA"/><text x="836" y="352" font-size="24" fill="#183E5B" font-weight="700">Feishu authorization</text><text x="836" y="393" font-size="18" fill="#20334F" font-weight="400">This task requests:</text><text x="836" y="426" font-size="17" fill="#496782" font-weight="400">docs:permission.member:create</text><text x="836" y="466" font-size="17" fill="#20334F" font-weight="400">Review the scope before approving.</text><text x="836" y="497" font-size="17" fill="#20334F" font-weight="400">Continue the task after authorization.</text><rect x="836" y="523" width="142" height="48" rx="16" fill="#176BEE"/><text x="860" y="554" font-size="18" fill="#FFFFFF" font-weight="600">Authorize</text><text x="812" y="646" font-size="16" fill="#60758B" font-weight="400">Personal authorization is owner-only.</text><text x="812" y="676" font-size="16" fill="#60758B" font-weight="400">Card content depends on the task.</text><text x="48" y="765" font-size="16" fill="#60758B" font-weight="400">Bot setup may require tenant approval, publishing and pairing. Business access depends on your configured tools.</text></g></svg>